# Workshop deployment: the web application plus the decoy services the
# port-scanning stage discovers.
#
# The web application is published ONLY on 8088. That is deliberate: the scan
# is what reveals it, so it must not also be sitting on 80 or 443. Port 8443
# is avoided because nmap assumes TLS there and never fingerprints a
# plain-HTTP service on it.
#
# Note for public hosts: Docker writes its own iptables rules, which bypass
# ufw. A `ufw deny` on a published port does NOT block it — restrict traffic
# in the provider's firewall (DigitalOcean Cloud Firewall) instead.
services:
  velorapid:
    build: .
    image: velorapid-lab
    container_name: velorapid-web
    command: ["node", "server/server.js"]
    ports:
      - "8088:8080"
    restart: unless-stopped

  # Workshop tooling, not part of the fiction: participants reach the flag
  # check at http://<ip>/ and the presenter dashboard at /dashboard.
  scoreboard:
    build: .
    image: velorapid-lab
    container_name: velorapid-scoreboard
    command: ["node", "scoreboard/server.js"]
    environment:
      SCOREBOARD_DATA: "/data/scoreboard.json"
    volumes:
      - scoreboard-data:/data
    ports:
      - "80:8080"
    restart: unless-stopped

  decoys:
    build: .
    image: velorapid-lab
    container_name: velorapid-decoys
    command: ["node", "decoys/server.js"]
    environment:
      WEB_PORT: "8088"
    ports:
      - "2222:2222"   # SSH banner  (OpenSSH 7.6p1)
      - "3306:3306"   # MySQL greeting
      - "6379:6379"   # Redis       (outside nmap's top-1000 on purpose)
      - "9999:9999"   # legacy gateway banner, carries the stage-1 flag
    restart: unless-stopped

volumes:
  # Survives `docker compose restart`, so a stumble mid-workshop does not
  # wipe everyone's progress. Remove it between groups: docker compose down -v
  scoreboard-data:
